name: CI

on:
  push:
    branches: [main, "refactor/v1"]
  pull_request:
    branches: [main, "refactor/v1"]

jobs:
  v1-package:
    name: tabvision (v1) — lint + types + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tabvision
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Install FretCam bridge package
        run: pip install --no-deps -e ../fretcam

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy tabvision

      - name: Pytest
        # -rs prints a reason for every skip. Without it, tests skipped for a
        # missing optional extra (torch et al.) are invisible in the summary,
        # and "N tests clean" reads as broader coverage than CI actually ran.
        run: pytest -v -rs

      - name: FretCam bridge lint + format
        run: |
          ruff check --config ../fretcam/pyproject.toml \
            ../fretcam/src/fretcam/tabvision_adapter.py \
            ../fretcam/src/fretcam/tabvision_bridge_probe.py \
            ../fretcam/tests/test_tabvision_adapter.py \
            ../fretcam/tests/test_tabvision_bridge_probe.py
          ruff format --config ../fretcam/pyproject.toml --check \
            ../fretcam/src/fretcam/tabvision_adapter.py \
            ../fretcam/src/fretcam/tabvision_bridge_probe.py \
            ../fretcam/tests/test_tabvision_adapter.py \
            ../fretcam/tests/test_tabvision_bridge_probe.py

      - name: FretCam bridge types + tests
        run: |
          mypy \
            ../fretcam/src/fretcam/tabvision_adapter.py \
            ../fretcam/src/fretcam/tabvision_bridge_probe.py
          pytest -q \
            ../fretcam/tests/test_tabvision_adapter.py \
            ../fretcam/tests/test_tabvision_bridge_probe.py
